name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Prepare scripts
        run: chmod +x scripts/*.sh BuildAndTest.command

      - name: Run XCTest
        run: ./scripts/run_tests.sh

      - name: Build unsigned IPA
        run: ./scripts/build_unsigned_ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ESP32CarController-unsigned-ipa
          path: build/ESP32CarController-unsigned.ipa
          if-no-files-found: error
